name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Validate instrument
        run: mra validate
      - name: Tests
        run: pytest -q
      - name: Reduced simulation grid (fails above 5% wrong outcomes)
        run: mra simulate --quick
