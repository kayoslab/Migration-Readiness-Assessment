<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold">Domain Readiness by Stakeholder Role</text>
  <text x="400" y="70" text-anchor="middle" fill="#718096" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Average scores across 6 readiness domains (scale: 1-5)</text>

  <!-- Radar chart centered at 400, 320 -->
  <g transform="translate(400, 320)">
    <!-- Background circles (score levels) -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="#4a5568" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#4a5568" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#4a5568" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#4a5568" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#4a5568" stroke-width="1" opacity="0.3"/>

    <!-- Score labels -->
    <text x="5" y="-195" fill="#718096" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">5.0</text>
    <text x="5" y="-155" fill="#718096" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">4.0</text>
    <text x="5" y="-115" fill="#718096" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">3.0</text>
    <text x="5" y="-75" fill="#718096" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">2.0</text>
    <text x="5" y="-35" fill="#718096" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">1.0</text>

    <!-- Neutral line (3.0) highlighted -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>

    <!-- Axis lines (6 domains at 60 degree intervals) -->
    <!-- Architecture (0°) -->
    <line x1="0" y1="0" x2="0" y2="-200" stroke="#4a5568" stroke-width="1"/>
    <!-- Team Capability (60°) -->
    <line x1="0" y1="0" x2="173" y2="-100" stroke="#4a5568" stroke-width="1"/>
    <!-- Governance (120°) -->
    <line x1="0" y1="0" x2="173" y2="100" stroke="#4a5568" stroke-width="1"/>
    <!-- Integration (180°) -->
    <line x1="0" y1="0" x2="0" y2="200" stroke="#4a5568" stroke-width="1"/>
    <!-- Business Alignment (240°) -->
    <line x1="0" y1="0" x2="-173" y2="100" stroke="#4a5568" stroke-width="1"/>
    <!-- Cultural (300°) -->
    <line x1="0" y1="0" x2="-173" y2="-100" stroke="#4a5568" stroke-width="1"/>

    <!-- Domain labels -->
    <text x="0" y="-228" text-anchor="middle" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Architecture</text>
    <text x="0" y="-213" text-anchor="middle" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">&amp; Technology</text>

    <text x="195" y="-100" text-anchor="start" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Team</text>
    <text x="195" y="-85" text-anchor="start" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Capability</text>

    <text x="195" y="105" text-anchor="start" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Governance</text>
    <text x="195" y="120" text-anchor="start" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">&amp; Delivery</text>

    <text x="0" y="230" text-anchor="middle" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Integration &amp;</text>
    <text x="0" y="245" text-anchor="middle" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Data Readiness</text>

    <text x="-195" y="100" text-anchor="end" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Business</text>
    <text x="-195" y="120" text-anchor="end" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Alignment</text>

    <text x="-195" y="-100" text-anchor="end" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Cultural</text>
    <text x="-195" y="-85" text-anchor="end" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Readiness</text>

    <!-- Engineering data polygon (scores: 3.4, 3.8, 3.0, 2.9, 3.2, 3.5) -->
    <!-- Scaled: score * 40 for radius -->
    <polygon
      points="0,-136 131,-76 120,92 0,116 -128,64 -140,-70"
      fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2"/>

    <!-- Product data polygon (scores: 3.2, 3.6, 2.8, 2.7, 3.5, 3.4) -->
    <polygon
      points="0,-128 124,-72 112,80 0,108 -140,60 -136,-68"
      fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2"/>

    <!-- Business data polygon (scores: 3.0, 3.4, 2.6, 2.6, 3.6, 3.2) -->
    <polygon
      points="0,-120 117,-68 104,68 0,104 -144,56 -128,-64"
      fill="#f39c12" fill-opacity="0.2" stroke="#f39c12" stroke-width="2"/>

    <!-- Leadership data polygon (scores: 3.1, 3.7, 3.2, 3.0, 3.4, 3.6) -->
    <polygon
      points="0,-124 127,-74 128,96 0,120 -136,68 -144,-72"
      fill="#00d9a5" fill-opacity="0.2" stroke="#00d9a5" stroke-width="2"/>

    <!-- Data points - Engineering -->
    <circle cx="0" cy="-136" r="4" fill="#3b82f6"/>
    <circle cx="131" cy="-76" r="4" fill="#3b82f6"/>
    <circle cx="120" cy="92" r="4" fill="#3b82f6"/>
    <circle cx="0" cy="116" r="4" fill="#3b82f6"/>
    <circle cx="-128" cy="64" r="4" fill="#3b82f6"/>
    <circle cx="-140" cy="-70" r="4" fill="#3b82f6"/>

    <!-- Data points - Product -->
    <circle cx="0" cy="-128" r="4" fill="#8b5cf6"/>
    <circle cx="124" cy="-72" r="4" fill="#8b5cf6"/>
    <circle cx="112" cy="80" r="4" fill="#8b5cf6"/>
    <circle cx="0" cy="108" r="4" fill="#8b5cf6"/>
    <circle cx="-140" cy="60" r="4" fill="#8b5cf6"/>
    <circle cx="-136" cy="-68" r="4" fill="#8b5cf6"/>

    <!-- Data points - Business -->
    <circle cx="0" cy="-120" r="4" fill="#f39c12"/>
    <circle cx="117" cy="-68" r="4" fill="#f39c12"/>
    <circle cx="104" cy="68" r="4" fill="#f39c12"/>
    <circle cx="0" cy="104" r="4" fill="#f39c12"/>
    <circle cx="-144" cy="56" r="4" fill="#f39c12"/>
    <circle cx="-128" cy="-64" r="4" fill="#f39c12"/>

    <!-- Data points - Leadership -->
    <circle cx="0" cy="-124" r="4" fill="#00d9a5"/>
    <circle cx="127" cy="-74" r="4" fill="#00d9a5"/>
    <circle cx="128" cy="96" r="4" fill="#00d9a5"/>
    <circle cx="0" cy="120" r="4" fill="#00d9a5"/>
    <circle cx="-136" cy="68" r="4" fill="#00d9a5"/>
    <circle cx="-144" cy="-72" r="4" fill="#00d9a5"/>
  </g>

  <!-- Legend -->
  <g transform="translate(580, 500)">
    <rect x="0" y="0" width="180" height="90" rx="6" fill="#2d3748" opacity="0.8"/>

    <line x1="15" y1="20" x2="35" y2="20" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="25" cy="20" r="4" fill="#3b82f6"/>
    <text x="45" y="24" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Engineering</text>

    <line x1="15" y1="40" x2="35" y2="40" stroke="#8b5cf6" stroke-width="3"/>
    <circle cx="25" cy="40" r="4" fill="#8b5cf6"/>
    <text x="45" y="44" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Product</text>

    <line x1="15" y1="60" x2="35" y2="60" stroke="#f39c12" stroke-width="3"/>
    <circle cx="25" cy="60" r="4" fill="#f39c12"/>
    <text x="45" y="64" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Business</text>

    <line x1="15" y1="80" x2="35" y2="80" stroke="#00d9a5" stroke-width="3"/>
    <circle cx="25" cy="80" r="4" fill="#00d9a5"/>
    <text x="45" y="84" fill="#cbd5e0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Leadership</text>
  </g>

  <!-- Neutral line indicator -->
  <g transform="translate(40, 500)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="40" y="14" fill="#718096" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">Neutral (3.0)</text>
  </g>
</svg>