<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f5a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#fff" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Monolith block (left) -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="120" height="180" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
    <rect x="10" y="10" width="100" height="25" rx="2" fill="#4a5568"/>
    <rect x="10" y="45" width="100" height="25" rx="2" fill="#4a5568"/>
    <rect x="10" y="80" width="100" height="25" rx="2" fill="#4a5568"/>
    <rect x="10" y="115" width="100" height="25" rx="2" fill="#4a5568"/>
    <rect x="10" y="150" width="100" height="20" rx="2" fill="#4a5568"/>
    <text x="60" y="210" text-anchor="middle" fill="#718096" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Monolith</text>
  </g>

  <!-- Arrow with question mark -->
  <g transform="translate(220, 130)">
    <line x1="0" y1="20" x2="80" y2="20" stroke="url(#amberGradient)" stroke-width="4" stroke-dasharray="8,4"/>
    <polygon points="80,10 100,20 80,30" fill="url(#amberGradient)"/>
    <text x="50" y="0" text-anchor="middle" fill="#f39c12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold">?</text>
  </g>

  <!-- Microservices (right) -->
  <g transform="translate(340, 55)">
    <rect x="0" y="0" width="50" height="50" rx="6" fill="#00d9a5" opacity="0.9"/>
    <rect x="60" y="0" width="50" height="50" rx="6" fill="#00d9a5" opacity="0.9"/>
    <rect x="0" y="60" width="50" height="50" rx="6" fill="#00d9a5" opacity="0.9"/>
    <rect x="60" y="60" width="50" height="50" rx="6" fill="#00d9a5" opacity="0.9"/>
    <rect x="30" y="120" width="50" height="50" rx="6" fill="#00d9a5" opacity="0.9"/>
    <!-- Connection lines -->
    <line x1="25" y1="50" x2="25" y2="60" stroke="#00f5a0" stroke-width="2"/>
    <line x1="85" y1="50" x2="85" y2="60" stroke="#00f5a0" stroke-width="2"/>
    <line x1="50" y1="25" x2="60" y2="25" stroke="#00f5a0" stroke-width="2"/>
    <line x1="50" y1="85" x2="60" y2="85" stroke="#00f5a0" stroke-width="2"/>
    <line x1="25" y1="110" x2="40" y2="120" stroke="#00f5a0" stroke-width="2"/>
    <line x1="85" y1="110" x2="70" y2="120" stroke="#00f5a0" stroke-width="2"/>
    <text x="55" y="200" text-anchor="middle" fill="#718096" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Composable</text>
  </g>

  <!-- Main title -->
  <text x="730" y="100" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="bold">Migration Readiness</text>
  <text x="730" y="150" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="bold">Assessment</text>

  <!-- Subtitle -->
  <text x="730" y="190" text-anchor="middle" fill="#a0aec0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16">Data-driven diagnostics for platform modernisation decisions</text>

  <!-- RAG indicators -->
  <g transform="translate(550, 220)">
    <circle cx="20" cy="15" r="12" fill="#e94560"/>
    <text x="45" y="20" fill="#e94560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Risk</text>

    <circle cx="130" cy="15" r="12" fill="#f39c12"/>
    <text x="155" y="20" fill="#f39c12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Caution</text>

    <circle cx="260" cy="15" r="12" fill="#00d9a5"/>
    <text x="285" y="20" fill="#00d9a5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Ready</text>
  </g>

  <!-- Decorative elements -->
  <circle cx="1100" cy="50" r="30" fill="none" stroke="#e94560" stroke-width="2" opacity="0.3"/>
  <circle cx="1120" cy="70" r="20" fill="none" stroke="#f39c12" stroke-width="2" opacity="0.3"/>
  <circle cx="1080" cy="90" r="15" fill="none" stroke="#00d9a5" stroke-width="2" opacity="0.3"/>

  <!-- Bottom accent line -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#accentGradient)"/>
</svg>