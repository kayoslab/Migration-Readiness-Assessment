# Delivery performance benchmarks. Rebuild with `mra benchmarks --update`; do not edit the segments by hand.
# `levels_2024` is transcribed from the Accelerate State of DevOps Report 2024 (v. 2024.3, p. 13) and is kept on update.
# `conversion` documents how the fact sheet's units map onto DORA's answer categories (mra/benchmark.py).
conversion:
  note: How measured fact-sheet values map onto DORA's answer categories (1 worst … 6 best). Durations use DORA's category
    boundaries; one month = 730 hours, six months = 4,380 hours.
  lead_time_hours / restore_hours: < 1 → 6 · < 24 → 5 · < 168 → 4 · < 730 → 3 · < 4,380 → 2 · otherwise 1
  deploys_per_week: ≥ 10 (two or more per working day) → 6 · ≥ 5 (about daily) → 5 · ≥ 1 → 4 · ≥ 0.23 (monthly) → 3 · ≥ 1/26
    (every six months) → 2 · otherwise 1
  change_failure_pct / deploy_rework_pct: score = 10 − percentage / 10 (DORA Quick Check)
levels_2024:
  source: Accelerate State of DevOps Report 2024, DORA (Google Cloud), v. 2024.3, "Performance levels", p. 13
  url: https://dora.dev/research/2024/dora-report/
  note: Clusters emerge from each year's survey and are not set in advance. DORA calls the faster cluster "high" and the slower
    but more stable one "medium", so change failure rate is not ranked by level. DORA no longer publishes levels (2025 introduced
    team archetypes) and advises that improving matters more than reaching a level.
  clusters:
  - level: Elite
    lead_time: Less than one day
    deployment_frequency: On demand (multiple deploys per day)
    change_fail_rate: 5%
    recovery_time: Less than one hour
    respondents: 19% (18–20%)
  - level: High
    lead_time: Between one day and one week
    deployment_frequency: Between once per day and once per week
    change_fail_rate: 20%
    recovery_time: Less than one day
    respondents: 22% (21–23%)
  - level: Medium
    lead_time: Between one week and one month
    deployment_frequency: Between once per week and once per month
    change_fail_rate: 10%
    recovery_time: Less than one day
    respondents: 35% (33–36%)
  - level: Low
    lead_time: Between one month and six months
    deployment_frequency: Between once per month and once every six months
    change_fail_rate: 40%
    recovery_time: Between one week and one month
    respondents: 25% (23–26%)
  by_category:
    leadtime:
      6: elite
      5: elite
      4: high
      3: medium
      2: low
      1: below low
    deployfreq:
      6: elite
      5: between elite and high
      4: high
      3: medium
      2: low
      1: below low
    failurerecovery:
      6: elite
      5: high or medium
      4: between medium and low
      3: low
      2: below low
      1: below low
source:
  title: DORA Quick Check benchmarks, 2025 edition
  research: DORA research programme, 2025
  publisher: DORA (Google Cloud)
  url: https://github.com/dora-team/dora.dev/tree/4ced7e46043ed3491e1768c8fff0ea5062e616bd/svelte/quick-check/src/lib/data/editions/2025
  commit: 4ced7e46043ed3491e1768c8fff0ea5062e616bd
  edition: 2025
  retrieved: '2026-10-30'
  licence: Apache-2.0 (dora.dev repository)
  note: Self-reported survey answers; means and standard deviations on DORA's 0–10 scale. Percentage metrics are stored on
    DORA's instability scale (mean × 10 ≈ mean percentage).
categories:
  leadtime:
    1: More than six months
    2: One to six months
    3: One week to one month
    4: One day to one week
    5: Less than one day
    6: Less than one hour
  deployfreq:
    1: Less than once per six months
    2: Between once per month and once every six months
    3: Between once per week and once per month
    4: Between once per day and once per week
    5: Between once per hour and once per day
    6: On demand (multiple deploys per day)
  failurerecovery:
    1: More than six months
    2: One to six months
    3: One week to one month
    4: One day to one week
    5: Less than one day
    6: Less than one hour
