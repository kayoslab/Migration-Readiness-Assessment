[project]
name = "mra"
version = "2.0.0"
description = "Migration Readiness Assessment: survey analysis and report generation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "ai>=0.8",          # Vercel AI SDK for Python (AI Gateway)
    "pydantic>=2.7",
    "typst>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "ipykernel", "nbstripout", "nbconvert", "tabulate"]

[project.scripts]
mra = "mra.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
